<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" fill="none">
  <defs>
    <!-- Gradients matching the Knowiix 3D ribbon K -->
    <linearGradient id="kStemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="kTopRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="kFoldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="60%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#00A6FF" />
    </linearGradient>
    <linearGradient id="kLowerLeg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON EMBLEM -->
  <g transform="translate(40, 20)">
    <!-- Vertical stem with rounded tips -->
    <path d="M48 10 C48 4.477 43.523 0 38 0 L20 0 C14.477 0 10 4.477 10 10 L10 170 C10 175.523 14.477 180 20 180 L38 180 C43.523 180 48 175.523 48 170 Z" fill="url(#kStemGrad)" />

    <!-- Upper diagonal ribbon extending up-right -->
    <path d="M40 92 L108 24 C112 20 118 20 122 24 L138 40 C142 44 142 50 138 54 L72 120 Z" fill="url(#kTopRibbon)" />

    <!-- 3D Ribbon Wrap & fold -->
    <path d="M10 105 C10 105 32 75 60 75 C88 75 106 100 106 100 C106 100 90 120 62 120 C34 120 10 105 10 105 Z" fill="url(#kFoldRibbon)" opacity="0.95" />

    <!-- Lower diagonal leg -->
    <path d="M60 90 L128 158 C132 162 138 162 142 158 L158 142 C162 138 162 132 158 128 L88 58 Z" fill="url(#kLowerLeg)" />
  </g>

  <!-- TEXT TYPOGRAPHY: Knowiix -->
  <g transform="translate(230, 155)">
    <!-- Main text 'Know' and 'x' in deep navy/white -->
    <text x="0" y="0" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="108" font-weight="900" fill="#0F172A" letter-spacing="-3">Know</text>
    <text x="325" y="0" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="108" font-weight="900" fill="#0F172A" letter-spacing="-3">x</text>

    <!-- The two 'i's with glowing cyan dots -->
    <text x="268" y="0" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="108" font-weight="900" fill="#0F172A" letter-spacing="-2">ı</text>
    <text x="296" y="0" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="108" font-weight="900" fill="#0F172A" letter-spacing="-2">ı</text>

    <!-- Dual cyan dots above 'ii' -->
    <circle cx="277" cy="-72" r="9" fill="#00A6FF" filter="url(#glow)" />
    <circle cx="305" cy="-72" r="9" fill="#00A6FF" filter="url(#glow)" />
  </g>
</svg>
